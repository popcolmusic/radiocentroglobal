<!-- ============================================ --><!-- VIDEOTECA RADIO CENTRO CON REPRODUCTOR WWE   --><!-- Al hacer clic en un video → abre reproductor --><!-- ============================================ -->
<div style="background-color:#0a0a0a;box-sizing:border-box;padding:30px 20px;width:100%;">
    <h2 style="border-left:5px solid #e91826;color:#f9b001;font-family:&apos;Bebas Neue&apos;, &apos;Impact&apos;, &apos;Arial Black&apos;, sans-serif;font-size:2.5rem;margin:0 0 30px;padding-left:20px;">
        📺 VIDEOTECA RADIO CENTRO
    </h2>
    <!-- REPRODUCTOR GRANDE (oculto al inicio) -->
    <div style="background-color:#000;border-radius:16px;border:2px solid #e91826;display:none;margin-bottom:30px;overflow:hidden;" id="wwePlayer">
        <div style="position:relative;">
            <iframe style="display:block;" id="wwePlayerIframe" width="100%" height="500" src="" frameborder="0" allowfullscreen=""></iframe> <button style="background-color:#e91826;border-radius:50%;border-style:none;color:white;cursor:pointer;font-size:1.5rem;height:40px;position:absolute;right:15px;top:15px;width:40px;z-index:10;" id="closePlayer">✕</button>
        </div>
        <div style="background-color:#111;padding:15px 20px;">
            <h3 style="color:#f9b001;font-family:&apos;Bebas Neue&apos;, sans-serif;font-size:1.3rem;margin:0 0 10px;" id="playerTitle">
                Título del video
            </h3>
            <div style="align-items:center;display:flex;flex-wrap:wrap;gap:20px;">
                <span style="background-color:#e91826;border-radius:20px;font-size:0.7rem;padding:4px 12px;"><strong>RADIO CENTRO VIDEO</strong></span> <span style="color:#aaa;font-size:0.75rem;">📅 Reproduciendo ahora</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:15px;margin-top:12px;">
                <span style="color:#f9b001;font-size:0.7rem;">📺 Disponible en: YouTube | Spotify | Apple Music</span>
            </div>
        </div>
    </div>
    <!-- LISTA DE VIDEOS -->
    <div style="display:flex;flex-direction:column;gap:25px;margin-bottom:40px;" id="wweVideosList">
        &nbsp;
    </div>
    <!-- PAGINACIÓN -->
    <div style="border-top:1px solid #2a2a2a;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px;padding-top:25px;" id="wwePaginacion">
        &nbsp;
    </div>
</div>
<style>
/* ESTILOS DE LA VIDEOTECA */
#wweVideosList .video-item {
    display: flex !important;
    gap: 25px !important;
    background: #111 !important;
    border-radius: 12px !important;
    overflow: hidden !important;
    border: 1px solid #2a2a2a !important;
    cursor: pointer !important;
    transition: transform 0.2s, border-color 0.2s !important;
}
#wweVideosList .video-item:hover {
    transform: translateX(8px) !important;
    border-color: #f9b001 !important;
}
#wweVideosList .video-thumbnail {
    position: relative !important;
    width: 300px !important;
    flex-shrink: 0 !important;
    background: #1a1a1a !important;
}
#wweVideosList .video-thumbnail img {
    width: 100% !important;
    height: 180px !important;
    object-fit: cover !important;
    display: block !important;
}
#wweVideosList .play-overlay {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(0,0,0,0.5) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    opacity: 0 !important;
    transition: opacity 0.2s !important;
}
#wweVideosList .video-item:hover .play-overlay {
    opacity: 1 !important;
}
#wweVideosList .play-icon {
    background: #e91826 !important;
    width: 65px !important;
    height: 65px !important;
    border-radius: 50% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 2rem !important;
    color: white !important;
    box-shadow: 0 0 20px rgba(233,24,38,0.8) !important;
}
#wweVideosList .video-info {
    flex: 1 !important;
    padding: 18px 20px 18px 0 !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
}
#wweVideosList .video-info h3 {
    font-size: 1.4rem !important;
    color: #fff !important;
    margin: 0 0 12px 0 !important;
    line-height: 1.3 !important;
    font-family: 'Bebas Neue', 'Impact', 'Arial Black', sans-serif !important;
    font-weight: normal !important;
}
#wweVideosList .video-meta {
    display: flex !important;
    align-items: center !important;
    gap: 20px !important;
    flex-wrap: wrap !important;
}
#wweVideosList .video-badge {
    background: #e91826 !important;
    color: white !important;
    padding: 5px 14px !important;
    border-radius: 25px !important;
    font-size: 0.8rem !important;
    font-weight: bold !important;
}
#wweVideosList .video-date {
    color: #aaa !important;
    font-size: 0.8rem !important;
    font-family: Arial, sans-serif !important;
}
#wwePaginacion .pagina-btn {
    background: #1a1a1a !important;
    border: 1px solid #2a2a2a !important;
    color: #ccc !important;
    padding: 12px 22px !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    font-weight: bold !important;
    font-size: 1rem !important;
    transition: 0.2s !important;
}
#wwePaginacion .pagina-btn:hover {
    background: #2a2a2a !important;
    color: #f9b001 !important;
    border-color: #f9b001 !important;
}
#wwePaginacion .pagina-btn.active {
    background: #e91826 !important;
    border-color: #e91826 !important;
    color: white !important;
}
@media (max-width: 700px) {
    #wweVideosList .video-item {
        flex-direction: column !important;
    }
    #wweVideosList .video-thumbnail {
        width: 100% !important;
    }
    #wweVideosList .video-thumbnail img {
        height: 200px !important;
    }
    #wweVideosList .video-info {
        padding: 15px !important;
    }
    #wweVideosList .video-info h3 {
        font-size: 1.2rem !important;
    }
    #wwePaginacion .pagina-btn {
        padding: 8px 16px !important;
        font-size: 0.8rem !important;
    }
    #wwePlayerIframe {
        height: 250px !important;
    }
}
</style><script>
(function() {
    // ============================================
    // DATOS DE VIDEOS CON LINKS DE YOUTUBE
    // (Reemplaza los ID de YouTube con los tuyos)
    // ============================================
    const videosData = [
        { titulo: "FULL MATCH: Undertaker vs. 'Stone Cold' Steve Austin", badge: "RADIO CENTRO VIDEO", fecha: "1 day ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=Undertaker+vs+Austin", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "FULL MATCH: John Cena vs. Big Show", badge: "RADIO CENTRO VIDEO", fecha: "1 day ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=Cena+vs+Big+Show", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "The Judgment Day arrasó con Paige y Brie Bella", badge: "RADIO CENTRO VIDEO", fecha: "2 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=Judgment+Day", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "Kendal Grey vs. Kelani Jordan: NXT", badge: "RADIO CENTRO VIDEO", fecha: "2 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=Kendal+vs+Kelani", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "Full NXT highlights: May 12, 2026", badge: "RADIO CENTRO VIDEO", fecha: "2 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=NXT+Highlights", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "Roman Reigns returns to SmackDown", badge: "RADIO CENTRO VIDEO", fecha: "3 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=Roman+Reigns", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "Cody Rhodes vs. Seth Rollins: Highlights", badge: "RADIO CENTRO VIDEO", fecha: "3 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=Cody+vs+Seth", youtubeId: "dQw4w9WgXcQ" },
        { titulo: "Rhea Ripley vs. Becky Lynch: Title match", badge: "RADIO CENTRO VIDEO", fecha: "4 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=Rhea+vs+Becky", youtubeId: "dQw4w9WgXcQ" }
    ];
    // Generar hasta 40 videos (completa los faltantes)
    while(videosData.length < 40) {
        videosData.push({
            titulo: "Video exclusivo " + (videosData.length + 1),
            badge: "RADIO CENTRO VIDEO",
            fecha: "Hace " + (Math.floor(Math.random() * 20) + 1) + " días",
            miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=VIDEO+" + (videosData.length + 1),
            youtubeId: "dQw4w9WgXcQ"
        });
    }
    const VIDEOS_POR_PAGINA = 8;
    let paginaActual = 1;
    const totalPaginas = Math.ceil(videosData.length / VIDEOS_POR_PAGINA);
    // Elementos del reproductor
    const playerDiv = document.getElementById('wwePlayer');
    const playerIframe = document.getElementById('wwePlayerIframe');
    const playerTitle = document.getElementById('playerTitle');
    const closePlayerBtn = document.getElementById('closePlayer');
    // Función para abrir el reproductor con un video
    function abrirReproductor(video) {
        // Construir URL de YouTube (con controles, sin info relacionada al final)
        const youtubeUrl = `https://www.youtube.com/embed/${video.youtubeId}?autoplay=1&rel=0&modestbranding=1&showinfo=0`;
        playerIframe.src = youtubeUrl;
        playerTitle.innerText = video.titulo;
        playerDiv.style.display = 'block';
        // Scroll suave al reproductor
        playerDiv.scrollIntoView({ behavior: 'smooth' });
    }
    // Cerrar reproductor
    function cerrarReproductor() {
        playerIframe.src = ''; // Detener reproducción
        playerDiv.style.display = 'none';
    }
    closePlayerBtn.addEventListener('click', cerrarReproductor);
    // Renderizar lista de videos
    function renderizarVideos() {
        const inicio = (paginaActual - 1) * VIDEOS_POR_PAGINA;
        const fin = inicio + VIDEOS_POR_PAGINA;
        const videosPagina = videosData.slice(inicio, fin);
        
        const contenedor = document.getElementById('wweVideosList');
        contenedor.innerHTML = videosPagina.map((video, idx) => `
            
<div class="video-item" data-video-index="${inicio + idx}">
                    
    <div class="video-thumbnail">
                            <img src="${video.miniatura}" alt="${video.titulo}">
                            
        <div class="play-overlay">
                                    
            <div class="play-icon">
                ▶
            </div>
                                
        </div>
                        
    </div>
                    
    <div class="video-info">
                            
        <h3>
            ${video.titulo}
        </h3>
                            
        <div class="video-meta">
                                    <span class="video-badge">${video.badge}</span>
                                    <span class="video-date">📅 ${video.fecha}</span>
                                
        </div>
                        
    </div>
                
</div>
        `).join('');
        
        // Agregar evento click a cada video
        document.querySelectorAll('#wweVideosList .video-item').forEach(item => {
            item.addEventListener('click', function() {
                const index = parseInt(this.dataset.videoIndex);
                const video = videosData[index];
                abrirReproductor(video);
            });
        });
    }
    // Renderizar paginación
    function renderizarPaginacion() {
        const contenedor = document.getElementById('wwePaginacion');
        let botones = '';
        
        botones += `<button class="pagina-btn" data-pagina="prev" ${paginaActual === 1 ? 'disabled style="opacity:0.5; cursor:not-allowed"' : ''}>◀ Anterior</button>`;
        
        for (let i = 1; i <= totalPaginas; i++) {
            if (i === 1 || i === totalPaginas || (i >= paginaActual - 2 && i <= paginaActual + 2)) {
                botones += `<button class="pagina-btn ${i === paginaActual ? 'active' : ''}" data-pagina="${i}">${i}</button>`;
            } else if (i === paginaActual - 3 || i === paginaActual + 3) {
                botones += `<span style="color:#666; padding:0 5px;">...</span>`;
            }
        }
        
        botones += `<button class="pagina-btn" data-pagina="next" ${paginaActual === totalPaginas ? 'disabled style="opacity:0.5; cursor:not-allowed"' : ''}>Siguiente ▶</button>`;
        
        contenedor.innerHTML = botones;
        
        document.querySelectorAll('#wwePaginacion .pagina-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const pagina = btn.dataset.pagina;
                if (pagina === 'prev' && paginaActual > 1) {
                    paginaActual--;
                } else if (pagina === 'next' && paginaActual < totalPaginas) {
                    paginaActual++;
                } else if (!isNaN(parseInt(pagina))) {
                    paginaActual = parseInt(pagina);
                }
                renderizarVideos();
                renderizarPaginacion();
                document.getElementById('wweVideosList').scrollIntoView({ behavior: 'smooth' });
                // Cerrar reproductor al cambiar de página
                cerrarReproductor();
            });
        });
    }
    renderizarVideos();
    renderizarPaginacion();
})();
</script>
