</style><script>

        { titulo: "Roman Reigns addresses The Bloodline's future after Backlash", categoria: "WWE SmackDown", fecha: "2 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=ROMAN+BLOODLINE" },
        { titulo: "Cody Rhodes vs. Seth Rollins announced for upcoming RAW", categoria: "WWE RAW", fecha: "2 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=CODY+VS+SETH" },
        { titulo: "Rhea Ripley injury update: Women's World Champion status", categoria: "WWE RAW", fecha: "3 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=RHEA+RIPLEY" },
        { titulo: "CM Punk reacts to backstage confrontation with Drew McIntyre", categoria: "WWE RAW", fecha: "3 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=CM+PUNK" },
        { titulo: "Jade Cargill vs. Bianca Belair set for next week's SmackDown", categoria: "WWE SmackDown", fecha: "4 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=JADE+VS+BIANCA" },
        { titulo: "The Judgment Day adds new member? Latest backstage news", categoria: "WWE RAW", fecha: "4 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=JUDGMENT+DAY" },
        { titulo: "LA Knight signs new contract with WWE", categoria: "WWE SmackDown", fecha: "5 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=LA+KNIGHT" },
        { titulo: "NXT Women's Championship match announced for next week", categoria: "WWE NXT", fecha: "5 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=NXT+WOMEN" },
        { titulo: "Gunther issues open challenge for Intercontinental Title", categoria: "WWE RAW", fecha: "6 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=GUNTHER" },
        { titulo: "Sami Zayn and Kevin Owens reunion backstage update", categoria: "WWE RAW", fecha: "6 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=SAMI+KO" },
        { titulo: "Bron Breakker vs. Ilja Dragunov for NXT Title", categoria: "WWE NXT", fecha: "1 week ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=BRON+VS+ILJA" },
        { titulo: "Becky Lynch returns to WWE programming next week", categoria: "WWE RAW", fecha: "1 week ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=BECKY+RETURNS" },
        { titulo: "Asuka vs. Iyo Sky announced for Backlash rematch", categoria: "WWE RAW", fecha: "1 week ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=ASUKA+VS+IYO" },
        { titulo: "Charlotte Flair reveals return date after injury", categoria: "WWE SmackDown", fecha: "1 week ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=CHARLOTTE" },
        { titulo: "The Rock makes surprise appearance at live event", categoria: "WWE SmackDown", fecha: "8 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=THE+ROCK" },
        { titulo: "New Day celebrates 10 years as tag team", categoria: "WWE RAW", fecha: "8 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=NEW+DAY" },
        { titulo: "Randy Orton RKO compilation goes viral", categoria: "WWE RAW", fecha: "9 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=RANDY+ORTON" },
        { titulo: "Bayley challenges Tiffany Stratton for Women's Title", categoria: "WWE SmackDown", fecha: "9 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=BAYLEY" },
        { titulo: "Solo Sikoa destroys AJ Styles on SmackDown", categoria: "WWE SmackDown", fecha: "10 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=SOLO+SIKOA" },
        { titulo: "Logan Paul teases WWE return at SummerSlam", categoria: "WWE RAW", fecha: "10 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=LOGAN+PAUL" },
        { titulo: "Andrade vs. Carmelo Hayes best of 7 series announced", categoria: "WWE SmackDown", fecha: "11 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=ANDRADE+VS+CARMELO" },
        { titulo: "Street Profits challenge Pretty Deadly for Tag Titles", categoria: "WWE SmackDown", fecha: "11 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=STREET+PROFITS" },
        { titulo: "WWE announces European tour dates for 2026", categoria: "WWE News", fecha: "12 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=EURO+TOUR" },
        { titulo: "NXT Level Up results: May 9, 2026", categoria: "WWE NXT", fecha: "12 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=NXT+LEVEL+UP" },
        { titulo: "Bianca Belair named ESPN's Wrestler of the Month", categoria: "WWE SmackDown", fecha: "13 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=BIANCA" },
        { titulo: "Triple H comments on WWE's creative direction", categoria: "WWE News", fecha: "13 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/e91826?text=TRIPLE+H" },
        { titulo: "WWE 2K26 roster reveal coming next week", categoria: "WWE News", fecha: "14 days ago", miniatura: "https://placehold.co/300x180/1a1a1a/f9b001?text=WWE+2K26" }
    ];
    // Generar hasta 50 noticias (si faltan, las completamos)
    while(noticiasData.length < 50) {
        const numero = noticiasData.length + 1;
        noticiasData.push({
            titulo: `Noticia WWE ${numero}: Novedades del mundo de la lucha libre`,
            categoria: ["WWE RAW", "WWE SmackDown", "WWE NXT", "WWE News"][Math.floor(Math.random() * 4)],
            fecha: `Hace ${Math.floor(Math.random() * 20) + 1} días`,
            miniatura: `https://placehold.co/300x180/1a1a1a/${Math.random() > 0.5 ? 'e91826' : 'f9b001'}?text=NEWS+${numero}`
        });
    }
    const NOTICIAS_POR_PAGINA = 10;
    let paginaActual = 1;
    const totalPaginas = Math.ceil(noticiasData.length / NOTICIAS_POR_PAGINA);
    // Renderizar noticias de la página actual
    function renderizarNoticias() {
        const inicio = (paginaActual - 1) * NOTICIAS_POR_PAGINA;
        const fin = inicio + NOTICIAS_POR_PAGINA;
        const noticiasPagina = noticiasData.slice(inicio, fin);
        
        const contenedor = document.getElementById('newsList');
        contenedor.innerHTML = noticiasPagina.map((noticia, idx) => `
            
<div class="news-item" data-news-index="${inicio + idx}">
                    
    <div class="news-thumbnail">
                            <img src="${noticia.miniatura}" alt="${noticia.titulo}">
                        
    </div>
                    
    <div class="news-info">
                            
        <h3>
            ${noticia.titulo}
        </h3>
                            
        <div class="news-meta">
                                    <span class="news-badge">WWE NEWS</span>
                                    <span class="news-category">📺 ${noticia.categoria}</span>
                                    <span class="news-date">📅 ${noticia.fecha}</span>
                                
        </div>
                        
    </div>
                
</div>
        `).join('');
        
        // Evento click en cada noticia
        document.querySelectorAll('.news-item').forEach(item => {
            item.addEventListener('click', function() {
                const index = parseInt(this.dataset.newsIndex);
                alert(`📰 Leyendo: ${noticiasData[index].titulo}`);
            });
        });
    }
    // Renderizar paginación
    function renderizarPaginacion() {
        const contenedor = document.getElementById('newsPaginacion');
        let botones = '';
        
        botones += `<button class="pagina-news-btn" data-pagina="prev" ${paginaActual === 1 ? 'disabled style="opacity:0.5; cursor:not-allowed"' : ''}>◀ Anterior</button>`;
        
        // Mostrar máximo 7 botones de página
        let inicioPaginas = Math.max(1, paginaActual - 3);
        let finPaginas = Math.min(totalPaginas, paginaActual + 3);
        
        if (inicioPaginas > 1) {
            botones += `<button class="pagina-news-btn" data-pagina="1">1</button>`;
            if (inicioPaginas > 2) botones += `<span style="color:#666; padding:0 5px;">...</span>`;
        }
        
        for (let i = inicioPaginas; i <= finPaginas; i++) {
            botones += `<button class="pagina-news-btn ${i === paginaActual ? 'active' : ''}" data-pagina="${i}">${i}</button>`;
        }
        
        if (finPaginas < totalPaginas) {
            if (finPaginas < totalPaginas - 1) botones += `<span style="color:#666; padding:0 5px;">...</span>`;
            botones += `<button class="pagina-news-btn" data-pagina="${totalPaginas}">${totalPaginas}</button>`;
        }
        
        botones += `<button class="pagina-news-btn" data-pagina="next" ${paginaActual === totalPaginas ? 'disabled style="opacity:0.5; cursor:not-allowed"' : ''}>Siguiente ▶</button>`;
        
        contenedor.innerHTML = botones;
        
        // Eventos de los botones de paginación
        document.querySelectorAll('.pagina-news-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const pagina = btn.dataset.pagina;
                if (pagina === 'prev' && paginaActual > 1) {
                    paginaActual--;
                } else if (pagina === 'next' && paginaActual < totalPaginas) {
                    paginaActual++;
                } else if (!isNaN(parseInt(pagina))) {
                    paginaActual = parseInt(pagina);
                }
                renderizarNoticias();
                renderizarPaginacion();
                // Scroll suave al inicio de la lista
                document.getElementById('newsList').scrollIntoView({ behavior: 'smooth' });
            });
        });
    }
    // Inicializar
    renderizarNoticias();
    renderizarPaginacion();
})();
</script>
