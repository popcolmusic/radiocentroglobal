        { title: "Conciertos en Vivo", url: "/videos/conciertos", type: "Videos", tags: ["conciertos", "lives", "presentaciones", "en vivo"] },
        { title: "Entrevistas", url: "/videos/entrevistas", type: "Videos", tags: ["entrevistas", "artistas", "conversaciones", "detrás de cámaras"] },
        
        // ========== CLUB DE FANS ==========
        { title: "Club de Fans Oficial", url: "/club-fans", type: "Comunidad", tags: ["club de fans", "fans club", "comunidad", "seguidores"] }
    ];
    
    // ============================================
    // TÉRMINOS POPULARES PARA SUGERENCIAS
    // ============================================
    const popularTerms = [
        "medellín", "shakira", "karol g", "feid", "maluma", "j balvin",
        "betuel devia", "javy", "ryan castro", "melissa mora",
        "noticias musicales", "noticias nuevas", "lo mas nuevo",
        "estrenos", "videos musicales", "videos", "lives",
        "eventos", "conciertos", "cantantes", "músicos",
        "música popular", "urbano", "reggae", "reggaetón",
        "mariachis", "latino", "pop latino",
        "posicionamiento seo", "seo", "distribución",
        "clubes de fans", "zizk music", "radio", "emisora"
    ];
    
    // Función para mostrar sugerencias
    function showSuggestions() {
        const suggestionsHtml = popularTerms.map(term => 
            `<span class="suggestion-tag" onclick="setSearchTerm('${term.replace(/'/g, "\\'")}')">🔍 ${term}</span>`
        ).join('');
        searchSuggestions.innerHTML = `
            
<div class="suggestions-title">
    ✦ BÚSQUEDAS POPULARES ✦
</div>
            
<div class="suggestions-grid">
    ${suggestionsHtml}
</div>
        `;
    }
    
    // Función para buscar
    function performSearch() {
        const query = searchInput.value.toLowerCase().trim();
        
        if (query === "") {
            searchResults.innerHTML = '
<div class="no-results">
    ⚠️ Ingresa un término de búsqueda
</div>
';
            showSuggestions();
            searchModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            return;
        }
        
        // Mostrar loading
        searchResults.innerHTML = '
<div class="no-results" style="color: #f9b001;">
    🔍 Buscando en Radio Centro...
</div>
';
        searchModal.style.display = 'block';
        document.body.style.overflow = 'hidden';
        
        // Buscar en título, tipo y tags
        const results = siteContent.filter(item => 
            item.title.toLowerCase().includes(query) ||
            item.type.toLowerCase().includes(query) ||
            (item.tags && item.tags.some(tag => tag.toLowerCase().includes(query)))
        );
        
        // Ordenar resultados por relevancia
        results.sort((a, b) => {
            const aTitle = a.title.toLowerCase();
            const bTitle = b.title.toLowerCase();
            const aTags = a.tags || [];
            const bTags = b.tags || [];
            
            // Prioridad exacta
            if (aTitle === query) return -1;
            if (bTitle === query) return 1;
            
            // Prioridad por tags
            if (aTags.some(t => t === query) && !bTags.some(t => t === query)) return -1;
            if (bTags.some(t => t === query) && !aTags.some(t => t === query)) return 1;
            
            return 0;
        });
        
        if (results.length === 0) {
            searchResults.innerHTML = `
                
<div class="no-results">
                        
    <p>
        ⚠️ No se encontraron resultados para "${query}"
    </p>
                        
    <p style="font-size: 0.8rem; margin-top: 10px;">
                                • Intenta con otras palabras<br>
                                • Revisa la ortografía<br>
                                • Prueba: ${popularTerms.slice(0, 6).join(", ")}
                            
    </p>
                    
</div>
            `;
            showSuggestions();
        } else {
            searchResults.innerHTML = results.map(item => `
                
<div class="search-result-item" onclick="window.location.href='${item.url}'">
                        
    <h4>
        ${item.title}
    </h4>
                        
    <p>
        📄 ${item.type} → ${item.url}
    </p>
                    
</div>
            `).join('');
            searchSuggestions.innerHTML = '';
        }
    }
    
    // Función global para buscar desde sugerencias
    window.setSearchTerm = function(term) {
        searchInput.value = term;
        performSearch();
    };
    
    // Eventos
    if (searchBtn) {
        searchBtn.addEventListener('click', performSearch);
    }
    
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    }
    
    if (closeModal) {
        closeModal.addEventListener('click', function() {
            searchModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        });
    }
    
    if (searchModal) {
        searchModal.addEventListener('click', function(e) {
            if (e.target === searchModal) {
                searchModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });
    }
    
    // Mostrar sugerencias iniciales
    showSuggestions();
});
</script>
